    <main>
        <h1>Conoce nuestros Servicios:</h1>
        <section class="servicios">
            <figure class="tarjeta" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="0">
                <h2>Insitu Live Audio</h2>
                <img src="../img/livesound.webp" alt="Foto de consola en vivo">
                <figcaption>Sonido en vivo para tus eventos</figcaption>
                <p>Brindamos equipos profesionales y personal especializado para cubrir todo tipo de eventos,
                    desde conciertos y presentaciones en vivo hasta eventos corporativos, festivales y espacios
                    privados. Contamos con roadies, stage managers, ingenieros de sonido y asistentes preparados
                    para trabajar en cada etapa del montaje y la operación técnica. Tú pones el evento y nosotros
                    nos encargamos de que el sonido esté a la altura de la experiencia que quieres ofrecerle a tu
                    público.
                </p>
            </figure>
            <figure class="tarjeta" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="150">
                <h2>Mezcla y Mastering</h2>
                <img src="../img/mixerbanner.webp" alt="Foto de faders">
                <figcaption>Deja que tu proyecto caiga en las manos adecuadas.</figcaption>
                <p>Tratamos cada canción con la atención y el cuidado que necesita para alcanzar un sonido
                    profesional. Nuestro equipo de ingenieros trabaja en los procesos de mezcla y mastering
                    buscando equilibrio, claridad, profundidad y una identidad sonora que represente la esencia
                    de cada proyecto. Ya sea una producción musical, un sencillo o un álbum completo, llevamos
                    tus canciones a un resultado listo para ser disfrutado en cualquier plataforma.
                    <a href="./portafolio.html">(Visita nuestro portafolio aquí)</a>
                </p>
            </figure>
            <figure class="tarjeta" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="300">
                <h2>Insitu IA</h2>
                <img src="../img/produccionfoto.jpg" alt="Foto de estudio a oscuras">
                <figcaption>La IA es el futuro, deja que te acompañemos en él</figcaption>
                <p> Incorporamos herramientas de inteligencia artificial al proceso de producción y creación
                    musical para ampliar las posibilidades de cada proyecto. Exploramos nuevas formas de
                    trabajar con audio, edición, producción y diseño sonoro, utilizando la tecnología como una
                    herramienta creativa que complementa el trabajo de músicos y productores. En Insitu IA
                    buscamos aprovechar estas nuevas tecnologías sin perder de vista la intención artística
                    detrás de cada proyecto.</p>
            </figure>
